name: Build and Release Python Packages to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Git tag version: $TAG_VERSION"

          if [ "$TAG_VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Release tags must use the v-prefixed form, for example v0.1.0"
            exit 1
          fi

      - name: Build distributions
        run: |
          uv build

      - name: Check distributions
        run: |
          uv run --with twine twine check dist/*

      - name: Verify wheel import
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/audit-ready-memory-verify
          /tmp/audit-ready-memory-verify/bin/python -m pip install dist/*.whl
          INSTALLED_VERSION=$(/tmp/audit-ready-memory-verify/bin/python -c "import audit_ready_memory; print(audit_ready_memory.__version__)")

          echo "Git tag version: $TAG_VERSION"
          echo "Installed package version: $INSTALLED_VERSION"

          if [ "$INSTALLED_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: tag v$TAG_VERSION produced package version $INSTALLED_VERSION"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    name: Publish audit-ready-memory to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
