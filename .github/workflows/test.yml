name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # setuptools-scm derives the package version from git tags.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Tests, benchmark set, and examples
        run: bash scripts/verify.sh

  demo-image:
    name: hosted demo image
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build the image
        run: docker build -t demo .

      - name: It refuses to start without sign-in settings
        run: |
          if docker run --rm demo; then
            echo "the image started without sign-in settings" >&2
            exit 1
          fi

      - name: It serves the app as a normal user
        run: |
          set -euo pipefail
          # made-up values: nothing here signs anyone in
          docker run -d --name demo -p 8501:8501 \
            -e ARM_AUTH_REDIRECT_URI=http://localhost:8501/oauth2callback \
            -e ARM_AUTH_COOKIE_SECRET=ci-only-not-a-secret \
            -e ARM_AUTH_GOOGLE_CLIENT_ID=ci-only-client \
            -e ARM_AUTH_GOOGLE_CLIENT_SECRET=ci-only-not-a-secret \
            demo
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8501/_stcore/health
          echo
          uid=$(docker exec demo awk '/^Uid:/{print $2}' /proc/1/status)
          echo "the app runs as uid $uid"
          test "$uid" = 10001
          # open the database engine inside the image, as the app does
          docker exec -u 10001 demo /app/.venv/bin/python -c \
            "from audit_ready_memory import Memory, Message; m = Memory('/data/ci-check'); m.add_message(Message(speaker='ci', content='ok')); print(len(m)); m.close()"

      - name: Show the log
        if: always()
        run: docker logs demo || true
