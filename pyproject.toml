[project]
name = "audit-ready-memory"
description = "Audit-ready, local-first memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "HumemAI" },
]
dynamic = ["version"]
dependencies = [
    "arcadedb-embedded>=26.8.1",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
demo = [
    "openai>=1.0",
    "streamlit>=1.30",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/humemai/audit-ready-memory"
Documentation = "https://docs.humem.ai/audit-ready-memory/"
Repository = "https://github.com/humemai/audit-ready-memory"
Issues = "https://github.com/humemai/audit-ready-memory/issues"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audit_ready_memory*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
docs = [
  "mike>=2.1,<3",
  "mkdocs-material>=9.6,<10",
]
